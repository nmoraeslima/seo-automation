[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-automation"
version = "0.1.0"
description = "Automacoes de SEO: briefings de conteudo e auditoria tecnica"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "google-api-python-client>=2.120.0",
    "google-auth>=2.28.0",
    "google-auth-httplib2>=0.2.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "curl_cffi>=0.7.0",
    "python-dotenv>=1.0.1",
    "openai>=1.30.0",
]

[project.scripts]
seo-automation = "seo_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
