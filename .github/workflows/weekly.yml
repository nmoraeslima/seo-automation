name: SEO semanal

on:
  schedule:
    # Toda segunda-feira as 08:00 (horario de Brasilia = 11:00 UTC)
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Escrever credenciais da service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Rodar briefings + auditoria
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          CONTROL_SPREADSHEET_ID: ${{ secrets.CONTROL_SPREADSHEET_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
        run: |
          python -m seo_automation.cli all

      - name: Limpar credenciais
        if: always()
        run: rm -f service_account.json
